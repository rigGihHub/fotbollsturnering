<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#166534">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./styles.css">
<title>CupNavi</title>
</head>
<body>
<header class="topbar">
  <div class="brand"><img src="./cupnavi_logo.png" alt="CupNavi" onerror="this.style.display='none'"><div><strong>CupNavi</strong><span id="cupName">Laddar cup…</span></div></div>
  <div id="connection" class="connection">● Online</div>
</header>
<main>
  <section id="setup" class="card setup-card">
    <h2>Öppna en cup</h2>
    <label>Cupkod eller slug<input id="cupKey" placeholder="t.ex. orebrocupen-2026"></label>
    <button id="loadCup" class="primary">Öppna cup</button>
  </section>
  <section id="teamPicker" class="card hidden">
    <label>⭐ Följ mitt lag<select id="teamSelect"></select></label>
  </section>
  <section id="liveCenter" class="hidden"></section>
  <section id="view"></section>
</main>
<nav class="hidden" id="nav" aria-label="Cupnavigation">
  <button data-page="matches" class="active">🗓️<span>Matcher</span></button>
  <button data-page="table">📊<span>Tabell</span></button>
  <button data-page="playoff">🏆<span>Slutspel</span></button>
  <button data-page="info">ℹ️<span>Info</span></button>
</nav>
<script src="./config.js"></script>
<script src="./app.js"></script>
</body></html>
