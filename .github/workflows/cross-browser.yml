name: Cross-browser compatibility

on:
  push:
  pull_request:

jobs:
  browser-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json
      - name: Install browser test dependencies
        run: |
          pip install pytest playwright
          python -m playwright install --with-deps chromium firefox webkit
      - name: Build current Next.js application
        run: |
          npm ci --prefix frontend-next
          npm run build --prefix frontend-next
      - name: Run Next.js browser matrix
        run: pytest -q e2e/test_cross_browser_matrix.py
