name: CupNavi CI

on:
  push:
  pull_request:

jobs:
  current-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip check

      - name: Compile all Python
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile
          files = [p for p in Path(".").rglob("*.py") if ".git" not in p.parts]
          for path in files:
              py_compile.compile(str(path), doraise=True)
          print(f"Compiled {len(files)} Python files")
          PY

      - name: Run maintained test suite
        run: python scripts/run_current_release_gate.py

      - name: Legacy Streamlit performance contract
        continue-on-error: true
        run: python scripts/check_performance_contract.py

      - name: Migration smoke test
        run: pytest tests/test_migrations.py -q

      - name: Backup smoke test
        run: pytest tests/test_backup.py -q

  next-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend-next
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-next/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        env:
          CUPNAVI_API_BASE: https://cupnavi-api.onrender.com
          NEXT_PUBLIC_CUPNAVI_API_BASE: https://cupnavi-api.onrender.com
        run: npm run build
