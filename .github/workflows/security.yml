name: Security and release integrity

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install application and audit tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install pip-audit
          pip check
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt
      - name: Verify release manifest on release tags
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/generate_release_manifest.py --check
      - name: Explain manifest policy on source builds
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: echo "Static RELEASE_MANIFEST verification is release-tag-only; source integrity is provided by the Git commit and dependency audit remains blocking."
