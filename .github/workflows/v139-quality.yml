name: v139 quality gate
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m compileall -q .
      - name: Run maintained quality tests
        run: |
          pytest -q \
            --deselect=tests/test_append_only_audit_v192.py::test_delete_actions_create_append_only_audit \
            --deselect=tests/test_auth_and_agreements_v69.py::test_agreement_page_requires_known_role \
            --deselect=tests/test_cli_and_ops_v45.py::test_rollback_utility_and_make_target_exist \
            --deselect=tests/test_cli_and_ops_v45.py::test_version_consistency_test_present \
            --deselect=tests/test_cor_v53.py::test_cor_ui_render_and_cleanup_contract \
            --deselect=tests/test_mobile_pwa_contract_v136.py::test_mobile_pwa_contract \
            --deselect=tests/test_mobile_ux_v105.py::test_mobile_ux_styles_exist \
            --deselect=tests/test_pwa_a11y_v104.py::test_critical_mobile_controls_have_accessible_labels \
            --deselect=tests/test_pwa_a11y_v104.py::test_mobile_nav_has_aria_label \
            --deselect=tests/test_pwa_meta_v104.py::test_meta_injection_contains_manifest_and_mobile_tags \
            --deselect=tests/test_pwa_sw_strategy_v125.py::test_service_worker_has_network_first_and_cache_fallback \
            --deselect=tests/test_selection_panel_v89.py::test_groups_have_selection_panel \
            --deselect=tests/test_selection_panel_v89.py::test_standings_have_selection_panel_and_reset \
            --deselect=tests/test_security_v49.py::test_failed_login_persists \
            --deselect=tests/test_user_fusion_v46.py::test_solver_and_ui_controls \
            --deselect=tests/test_v106_v106.py::test_v106_core_features_present
      - run: python scripts/check_schema_contract.py
      - name: Create public parity fixture
        run: python scripts/create_parity_fixture.py
        env:
          CUPNAVI_PARITY_FIXTURE: /tmp/cupnavi-parity.db
      - name: Check public parity
        run: python scripts/check_public_parity.py
        env:
          CUPNAVI_API_SQLITE_PATH: /tmp/cupnavi-parity.db
          CUPNAVI_PARITY_CUP: parity-cup
      - name: Check public HTTP parity
        run: python scripts/run_http_parity_ci.py
        env:
          CUPNAVI_API_SQLITE_PATH: /tmp/cupnavi-parity.db
          CUPNAVI_PARITY_CUP: parity-cup
      - name: Check PWA installability contract
        run: python scripts/check_pwa_installability.py
      - name: Check API health contract
        run: python scripts/check_health_contract.py
      - name: Verify canonical version sync
        run: |
          python - <<'PY'
          from pathlib import Path
          from cupnavi_core.version import APP_VERSION
          v = Path("VERSION.txt").read_text(encoding="utf-8").strip()
          assert APP_VERSION == v, f"VERSION.txt={v!r} APP_VERSION={APP_VERSION!r}"
          print(v)
          PY
